<script>
/* Sin comentarios de doble barra ni direcciones con doble barra en este
   script: Apps Script los toma por comentarios al servir la plantilla
   (BD Socios, CLAUDE.md §3.9). */
(function () {
  window.addEventListener('error', function (ev) {
    var c = document.getElementById('contenido');
    if (c) c.insertAdjacentHTML('afterbegin', '<div class="error">Error en la ventana: ' + String(ev.message) + '</div>');
  });
})();

var D = null;
var S = document.body.dataset.seccion || 'transferencia';
var INICIAL = document.body.dataset.inicial || '';
var sel = '';
var archivo = null;
var socios = null;
var cuotas = [];
var tipoEfectivo = 'cuotas';
var hecho = null;
var ocupado = false;

var TITULOS = {
  traspaso: ['Traspaso entre banco y efectivo', 'Ingresar en el banco el efectivo, o sacar dinero del cajero. Apúntalo ANTES de ingresarlo.'],
  transferencia: ['Nuevo gasto por transferencia', 'Apúntalo aquí antes de ordenarlo en la app del banco.'],
  pendientes: ['Transferencias pendientes', 'Apuntadas pero que todavía no han salido del banco.'],
  completar: ['Movimientos del banco por completar', 'Gastos que han llegado con el extracto y no tienen partida: sobre todo, pagos con tarjeta.'],
  facturas: ['Facturas que faltan', 'Gastos sin factura adjunta. Si alguno no la necesita (un movimiento entre cuentas de JMV, una devolución), márcalo aquí.'],
  efectivo: ['Ingreso o gasto en efectivo', 'Lo que entra o sale de la caja de efectivo.']
};
var LISTAS = { pendientes: true, completar: true, facturas: true };

function $(id) { return document.getElementById(id); }
function esc(t) { return String(t === null || t === undefined ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function norm(t) { return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function euros(n) {
  var v = Math.round((Number(n) || 0) * 100) / 100;
  var s = Math.abs(v).toFixed(2).split('.');
  return (v < 0 ? '-' : '') + s[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + s[1] + ' €';
}
function importeTexto(n) { return Math.abs(Number(n) || 0).toFixed(2).replace('.', ','); }
function numero(t) {
  var s = String(t || '').replace(/[€\s]/g, '');
  if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  else s = s.replace(/,/g, '');
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function fechaCorta(iso) { return iso ? iso.split('-').reverse().join('/') : ''; }
function compactar(t) { return String(t || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function formatoIban(t) { return compactar(t).replace(/(.{4})(?=.)/g, '$1 '); }
function textoParaBanco(t) {
  return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[ºª]/g, '')
    .replace(/[^A-Za-z0-9 \/\-?:().,'+]/g, ' ').replace(/\s+/g, ' ').trim();
}
function sinId(asunto, id) { var t = String(asunto || ''); return t.indexOf(id) === 0 ? t.slice(id.length).trim() : t; }
function idPrevisto(iso) {
  if (!iso) return 'AAAAMMDD-NN';
  var pref = iso.replace(/-/g, '') + '-', max = 0;
  D.ids.forEach(function (id) { if (id.indexOf(pref) === 0) { var n = parseInt(id.slice(pref.length), 10); if (n > max) max = n; } });
  return pref + String(max + 1).padStart(2, '0');
}
function partidaTexto(codigo) {
  if (!codigo) return '';
  if (codigo === D.ejercicioAnterior) return codigo;
  var p = D.partidas.ingresos.concat(D.partidas.gastos).find(function (x) { return x.codigo === codigo; });
  return p && p.descripcion ? p.codigo + D.separador + p.descripcion : codigo;
}

function cargando(si, texto) { $('cargando').hidden = !si; if (texto) $('textoCargando').textContent = texto; }
function estado(texto, hay) { $('estado').textContent = texto || ''; $('estado').className = hay ? 'hay' : ''; }
function resultado(clase, titulo, lineas) {
  var r = $('resultado');
  if (!r) { $('contenido').insertAdjacentHTML('afterbegin', '<div id="resultado"></div>'); r = $('resultado'); }
  var ls = (lineas || []).filter(Boolean);
  r.hidden = false;
  r.className = clase;
  r.innerHTML = '<b>' + esc(titulo) + '</b>' + (ls.length ? '<ul>' + ls.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>' : '');
  r.scrollIntoView({ block: 'nearest' });
}
function fallo(err) { ocupado = false; cargando(false); $('guardar').disabled = false; resultado('error', 'No se ha podido guardar', [err && err.message ? err.message : String(err)]); }

function cargar(silencioso, despues) {
  if (!silencioso) cargando(true, 'Leyendo Caja…');
  google.script.run
    .withSuccessHandler(function (d) { D = d; cargando(false); pintarLateral(); if (despues) despues(); })
    .withFailureHandler(function (err) {
      cargando(false);
      $('contenido').innerHTML = '<div class="error">No se ha podido leer la hoja: ' + esc(err.message || err) + '</div>';
    })
    .datosDeAsientos();
}

/* ---------------------------------------------------------------
   LATERAL: saldos, secciones y lista
   --------------------------------------------------------------- */

function enLista(s, a) {
  if (s === 'pendientes') return a.pendiente;
  if (s === 'completar') return a.completar;
  if (s === 'facturas') return a.faltaFactura;
  return false;
}
function listaDe(s) {
  return D.asientos.filter(function (a) { return enLista(s, a); })
    .sort(function (x, y) { return (y.fechaPago || y.fecha) < (x.fechaPago || x.fecha) ? -1 : 1; });
}

function pintarLateral() {
  $('saldos').innerHTML = 'Ejercicio <b>' + esc(D.ejercicio) + '</b><br>Banco: <b>' + euros(D.saldos.banco)
    + '</b> · Efectivo: <b>' + euros(D.saldos.efectivo) + '</b>';
  ['pendientes', 'completar', 'facturas'].forEach(function (s) {
    var n = listaDe(s).length;
    $('n_' + s).textContent = n;
    $('n_' + s).className = 'n' + (n ? '' : ' cero');
  });
  document.querySelectorAll('#secciones button').forEach(function (b) { b.classList.toggle('sel', b.dataset.s === S); });
  $('panelLista').hidden = !LISTAS[S];
  if (LISTAS[S]) pintarLista();
}

function pintarLista() {
  var q = norm($('buscar').value).split(/\s+/).filter(Boolean);
  var todos = listaDe(S);
  var xs = todos.filter(function (a) {
    var t = norm([a.id, a.fecha, fechaCorta(a.fecha), importeTexto(a.cantidad), a.concepto, a.descripcion, a.proveedor, a.partida, a.metodo].join(' '));
    return q.every(function (p) { return t.indexOf(p) >= 0; });
  });
  $('contador').textContent = !todos.length ? '' : xs.length !== todos.length ? xs.length + ' de ' + todos.length
    : todos.length + (todos.length === 1 ? ' asiento' : ' asientos');
  if (!todos.length) { $('lista').innerHTML = '<div class="item" style="cursor:default;color:#889">No hay ninguno. ✓</div>'; return; }
  $('lista').innerHTML = xs.map(function (a) {
    var chips = [];
    if (a.metodo === 'Tarjeta') chips.push('<span class="chip tarjeta">Tarjeta</span>');
    else if (a.metodo && !a.pendiente) chips.push('<span class="chip">' + esc(a.metodo) + '</span>');
    if (a.pendiente && S !== 'pendientes') chips.push('<span class="chip pend">Pendiente</span>');
    if (S === 'facturas' && !a.partida) chips.push('<span class="chip">sin partida</span>');
    var texto = a.descripcion || a.proveedor || a.concepto || '(sin descripción)';
    return '<div class="item' + (a.id === sel ? ' activo' : '') + '" data-id="' + esc(a.id) + '">'
      + '<div class="linea1"><span>' + fechaCorta(a.fechaPago || a.fecha) + '</span> ' + chips.join(' ')
      + '<span class="importe">' + euros(a.cantidad) + '</span></div>'
      + '<div class="sub">' + esc(a.id) + ' · ' + esc(texto) + '</div></div>';
  }).join('');
  $('lista').querySelectorAll('.item[data-id]').forEach(function (el) {
    el.addEventListener('click', function () { elegir(el.dataset.id); });
  });
}

function irA(s, id) {
  if (hayCambios() && !confirm('Hay cambios sin guardar. ¿Salir sin guardarlos?')) return;
  S = s; sel = id || ''; archivo = null; hecho = null;
  $('buscar').value = '';
  pintarLateral();
  pintarPrincipal();
}
function elegir(id) {
  if (id === sel) return;
  if (hayCambios() && !confirm('Hay cambios sin guardar en ' + sel + '. ¿Salir sin guardarlos?')) return;
  sel = id; archivo = null;
  pintarLista();
  pintarPrincipal();
}

/* ---------------------------------------------------------------
   PIEZAS DE FORMULARIO
   --------------------------------------------------------------- */

function campo(id, etiqueta, control, opciones) {
  opciones = opciones || {};
  return '<div class="campo' + (opciones.ancho ? ' ancho' : '') + '" id="c_' + id + '"><label for="' + id + '">' + esc(etiqueta) + '</label>'
    + control + (opciones.nota !== undefined ? '<div class="nota" id="nota_' + id + '">' + opciones.nota + '</div>' : '') + '</div>';
}
function entrada(id, valor, atributos) {
  return '<input id="' + id + '" value="' + esc(valor) + '" autocomplete="off" ' + (atributos || '') + '>';
}
function soloLectura(etiqueta, valor, ancho) {
  return '<div class="campo' + (ancho ? ' ancho' : '') + '"><label>' + esc(etiqueta) + '</label><div class="ro">' + (valor || '—') + '</div></div>';
}
function combo(id, placeholder) {
  return '<div style="position:relative"><input id="' + id + '" autocomplete="off" placeholder="' + esc(placeholder) + '">'
    + '<div class="sugerencias" id="' + id + '_sug" hidden></div></div>';
}
function val(id) { var e = $(id); return e ? String(e.value).trim() : ''; }

/* Desplegable de partidas que busca por código y por nombre. El código
   elegido queda en dataset.valor; en el campo se ve «G21 · Nombre». */
function montarComboPartida(id, lado, inicial, alCambiar) {
  var input = $(id), caja = $(id + '_sug'), marcada = -1, vistas = [];
  var base = lado.charAt(0) === 'I' ? D.partidas.ingresos : D.partidas.gastos;
  var opciones = base.map(function (p) { return { codigo: p.codigo, texto: partidaTexto(p.codigo) }; });
  if (/\+EA$/.test(lado)) opciones.push({ codigo: D.ejercicioAnterior, texto: D.ejercicioAnterior + ' (ya estaba en el saldo inicial)' });
  function poner(codigo) {
    input.dataset.valor = codigo || '';
    input.value = codigo ? partidaTexto(codigo) : '';
    caja.hidden = true;
    if (alCambiar) alCambiar(codigo || '');
  }
  function pintar() {
    var q = norm(input.value).split(/\s+/).filter(Boolean);
    vistas = opciones.filter(function (o) { var t = norm(o.texto); return q.every(function (p) { return t.indexOf(p) >= 0; }); });
    if (!vistas.length) { caja.innerHTML = '<div style="color:#889;cursor:default">Ninguna partida con eso. Si falta, añádela en la hoja Presupuesto.</div>'; caja.hidden = false; return; }
    marcada = Math.min(Math.max(marcada, 0), vistas.length - 1);
    caja.innerHTML = vistas.map(function (o, i) {
      var t = esc(o.texto), k = t.indexOf(esc(D.separador));
      return '<div data-i="' + i + '"' + (i === marcada ? ' class="marcada"' : '') + '>'
        + (k > 0 ? '<b>' + t.slice(0, k) + '</b>' + t.slice(k) : '<b>' + t + '</b>') + '</div>';
    }).join('');
    caja.hidden = false;
    caja.querySelectorAll('div[data-i]').forEach(function (d) {
      d.addEventListener('mousedown', function (ev) { ev.preventDefault(); poner(vistas[Number(d.dataset.i)].codigo); });
    });
  }
  input.addEventListener('focus', function () { input.select(); marcada = 0; pintar(); });
  input.addEventListener('input', function () { input.dataset.valor = ''; marcada = 0; pintar(); if (alCambiar) alCambiar(''); });
  input.addEventListener('keydown', function (ev) {
    if (caja.hidden) return;
    if (ev.key === 'ArrowDown') { marcada = Math.min(marcada + 1, vistas.length - 1); pintar(); ev.preventDefault(); }
    else if (ev.key === 'ArrowUp') { marcada = Math.max(marcada - 1, 0); pintar(); ev.preventDefault(); }
    else if (ev.key === 'Enter' && vistas[marcada]) { poner(vistas[marcada].codigo); ev.preventDefault(); }
    else if (ev.key === 'Escape') { caja.hidden = true; }
  });
  input.addEventListener('blur', function () {
    caja.hidden = true;
    if (input.dataset.valor) { input.value = partidaTexto(input.dataset.valor); return; }
    var escrito = compactar(input.value);
    var exacta = opciones.find(function (o) { return compactar(o.codigo) === escrito; });
    if (exacta) poner(exacta.codigo);
    else if (vistas.length === 1 && input.value) poner(vistas[0].codigo);
  });
  if (inicial) { input.dataset.valor = inicial; input.value = partidaTexto(inicial); } else input.dataset.valor = '';
  return { poner: poner };
}

/* Las mismas comprobaciones que el servidor (ibanValido(),
   documentoFiscalValido()), para avisar mientras se escribe. */
function ibanValido(t) {
  var c = compactar(t);
  if (!/^[A-Z]{2}\d{2}[A-Z0-9]{11,30}$/.test(c)) return false;
  if (c.slice(0, 2) === 'ES' && c.length !== 24) return false;
  var r = c.slice(4) + c.slice(0, 4), resto = 0;
  for (var i = 0; i < r.length; i++) {
    var v = /\d/.test(r[i]) ? r[i] : String(r.charCodeAt(i) - 55);
    for (var j = 0; j < v.length; j++) resto = (resto * 10 + Number(v[j])) % 97;
  }
  return resto === 1;
}
function documentoValido(t) {
  var c = compactar(t), L = 'TRWAGMYFPDXBNJZSQVHLCKE', m;
  if (!c) return null;
  if ((m = c.match(/^(\d{8})([A-Z])$/))) return L.charAt(parseInt(m[1], 10) % 23) === m[2];
  if ((m = c.match(/^([XYZ])(\d{7})([A-Z])$/))) return L.charAt(parseInt('XYZ'.indexOf(m[1]) + m[2], 10) % 23) === m[3];
  if (!(m = c.match(/^([ABCDEFGHJNPQRSUVW])(\d{7})([0-9A-J])$/))) return null;
  var suma = 0;
  m[2].split('').forEach(function (x, i) { x = Number(x); if (i % 2) suma += x; else { var y = 2 * x; suma += Math.floor(y / 10) + y % 10; } });
  var dig = (10 - suma % 10) % 10, letra = 'JABCDEFGHI'.charAt(dig);
  if ('NPQRSW'.indexOf(m[1]) >= 0) return m[3] === letra;
  if ('ABEH'.indexOf(m[1]) >= 0) return m[3] === String(dig);
  return m[3] === String(dig) || m[3] === letra;
}
function comprobarIban() {
  if (!$('f_iban')) return;
  var t = val('f_iban'), ok = !t || ibanValido(t);
  $('c_f_iban').classList.toggle('mal', !ok);
  $('nota_f_iban').innerHTML = !t ? '' : ok ? '<span class="verde">✓ IBAN correcto</span>' : '<span class="rojo">IBAN incompleto o con alguna errata</span>';
}
function comprobarCif() {

  var banco = '';
  if (a.delBanco || !a.pendiente) {
    banco = '<fieldset><legend>Movimiento</legend><div class="rejilla">'
      + soloLectura('Fecha de pago', fechaCorta(a.fechaPago || a.fecha))
      + soloLectura('Importe', '<b>' + euros(a.cantidad) + '</b>')
      + soloLectura('Método de pago', esc(a.metodo) + (a.efectivo ? ' (caja de efectivo)' : ''))
      + soloLectura('ID del asiento', esc(a.id))
      + (a.concepto ? soloLectura('Concepto del banco', esc(a.concepto), true) : '')
      + '</div></fieldset>';
  }
  var pend = '';
  if (a.pendiente) {
    pend = tarjetaBanco(a)
      + '<fieldset><legend>Pago</legend><div class="rejilla">'
      + campo('f_fecha', 'Fecha (de la factura o del gasto)', entrada('f_fecha', a.fecha, 'type="date"'))
      + campo('f_importe', 'Importe a pagar (€)', entrada('f_importe', importeTexto(a.cantidad), 'inputmode="decimal"'))
      + campo('f_asunto', 'Asunto (después de ' + esc(a.id) + ')', entrada('f_asunto', sinId(a.asunto, a.id)), { ancho: true })
      + '</div></fieldset>';
  }
  var factura = a.metodo === 'Cargo bancario' ? '' : zonaFactura(a);
  var arriba = S === 'facturas' ? factura : (a.faltaFactura ? '<div class="aviso">Este gasto no tiene factura: súbela abajo o, si no la necesita, márcalo allí.</div>' : '');
  c.innerHTML = '<div id="resultado" hidden></div>' + arriba + pend + banco
    + '<fieldset><legend>Imputación</legend><div class="rejilla">'
    + campo('f_partida', 'Partida', combo('f_partida', 'Código o nombre'))
    + campo('f_subpartida', 'Subpartida', '<select id="f_subpartida"></select>')
    + campo('f_descripcion', 'Descripción', entrada('f_descripcion', a.descripcion, 'placeholder="Qué es: material para…"'), { ancho: true, nota: 'Es lo que sale en los informes (nunca el concepto del banco).' })
    + '</div></fieldset>'
    + '<fieldset><legend>Proveedor</legend><div class="rejilla">' + camposProveedor(a, a.pendiente) + '</div></fieldset>'
    + (S === 'facturas' ? '' : factura)
    + (a.pendiente ? '<div style="margin-top:4px"><button id="anular" class="peligro">Anular esta transferencia (no se va a hacer)</button></div>' : '');
  $('guardar').textContent = 'Guardar';
  var lado = a.cantidad < 0 ? 'G+EA' : 'I+EA';
  montarComboPartida('f_partida', lado, a.partida, function (p) { rellenarSubpartidas('f_subpartida', p, val('f_subpartida')); marcarCambios(); });
  rellenarSubpartidas('f_subpartida', a.partida, a.subpartida);
  montarProveedor();
  montarZonaFactura();
  montarTarjetaBanco();
  c.querySelectorAll('input, select').forEach(function (e) { e.addEventListener('input', marcarCambios); e.addEventListener('change', marcarCambios); });
  if ($('anular')) $('anular').addEventListener('click', function () { anular(a); });
  marcarCambios();
}

function cambiosDe(a) {
  if (!a || !$('f_descripcion')) return {};
  var actual = {
    partida: partidaDe('f_partida') || (val('f_partida') ? val('f_partida') : ''),
    subpartida: val('f_subpartida'), descripcion: val('f_descripcion'), proveedor: val('f_proveedor'), cif: val('f_cif')
  };
  if (valSinFactura() !== null) actual.sinFactura = valSinFactura();
  if (a.pendiente) {
    actual.fecha = val('f_fecha'); actual.importe = val('f_importe');
    actual.cuentaAbono = val('f_iban'); actual.titular = val('f_titular'); actual.asunto = val('f_asunto');
  }
  var cambios = {};
  Object.keys(actual).forEach(function (k) {
    var antes = a[k === 'importe' ? 'cantidad' : k];
    var mismo;
    if (k === 'importe') mismo = Math.abs(numero(actual[k])).toFixed(2) === Math.abs(antes || 0).toFixed(2);
    else if (k === 'asunto') mismo = textoParaBanco(actual[k]) === sinId(antes, a.id);
    else if (k === 'cuentaAbono' || k === 'cif') mismo = compactar(actual[k]) === compactar(antes);
    else mismo = String(actual[k]).trim() === String(antes || '').trim();
    if (!mismo) cambios[k] = { antes: antes === null || antes === undefined ? '' : antes, despues: actual[k] };
  });
  return cambios;
}
function asientoSel() { return D && sel ? D.asientos.find(function (a) { return a.id === sel; }) : null; }
function hayCambios() {
  if (LISTAS[S] && asientoSel()) return Object.keys(cambiosDe(asientoSel())).length > 0 || !!archivo;
  if (S === 'efectivo') return cuotas.length > 0 || !!val('e_importe');
  if (S === 'transferencia' && !hecho) return !!(val('f_importe') || val('f_proveedor') || archivo);
  return false;
}
function marcarCambios() {
  if (!LISTAS[S] || !asientoSel()) return;
  var n = Object.keys(cambiosDe(asientoSel())).length + (archivo ? 1 : 0);
  estado(n ? 'Hay cambios sin guardar.' : '', !!n);
  ['partida', 'subpartida', 'descripcion', 'proveedor', 'cif', 'fecha', 'importe', 'asunto', 'iban', 'titular'].forEach(function (k) {
    var e = $('c_f_' + k); if (!e) return;
    var clave = k === 'iban' ? 'cuentaAbono' : k;
    e.classList.toggle('sucio', clave in cambiosDe(asientoSel()));
  });
}
function guardarAsiento() {
  var a = asientoSel();
  if (!a) return;
  if (val('f_partida') && !partidaDe('f_partida')) { resultado('error', 'Elige la partida de la lista', ['«' + val('f_partida') + '» no es ninguna partida.']); return; }
  var cambios = cambiosDe(a);
  if (!Object.keys(cambios).length && !archivo) { resultado('info', 'No hay nada que guardar.'); return; }
  enviar('Guardando ' + a.id + '…', 'guardarCambiosDeAsiento', { id: a.id, cambios: cambios }, function (r) {
    var lista = listaDe(S), i = lista.findIndex(function (x) { return x.id === a.id; });
    var k = D.asientos.findIndex(function (x) { return x.id === a.id; });
    D.asientos[k] = r.asiento;
    archivo = null;
    var sigue = enLista(S, r.asiento);
    if (!sigue) {
      var resto = listaDe(S);
      sel = resto.length ? resto[Math.min(i, resto.length - 1)].id : '';
    }
    pintarLateral();
    pintarPrincipal();
    resultado(r.lineas.some(function (l) { return l.charAt(0) === '⚠'; }) ? 'aviso' : 'ok',
      sigue ? a.id + ': guardado' : a.id + ' ya está completo' + (sel ? '. Este es el siguiente:' : '.'), r.lineas);
    cargar(true, function () { pintarLateral(); });
  }, true);
}
function anular(a) {
  if (!confirm('¿Borrar el asiento ' + a.id + ' (' + euros(a.cantidad) + ' a ' + (a.proveedor || '¿?') + ')? '
    + 'Hazlo solo si la transferencia NO se ha hecho ni se va a hacer.')) return;
  enviar('Borrando ' + a.id + '…', 'anularTransferenciaPendiente', a.id, function (r) {
    D.asientos = D.asientos.filter(function (x) { return x.id !== a.id; });
    sel = '';
    pintarLateral(); pintarPrincipal();
    resultado('ok', 'Transferencia anulada', r.lineas);
    cargar(true, function () { pintarLateral(); });
  });
}

/* ---- Efectivo ---- */
function pintarEfectivo(c) {
  var tipos = [['cuotas', 'Cuotas cobradas en mano'], ['ingreso', 'Otro ingreso'], ['gasto', 'Gasto en efectivo']];
  var h = '<div class="info">En la caja de efectivo hay ahora <b>' + euros(D.saldos.efectivo) + '</b>.</div>'
    + '<div class="tipos" id="tiposEfectivo">' + tipos.map(function (t) {
      return '<label' + (t[0] === tipoEfectivo ? ' class="sel"' : '') + '><input type="radio" name="te" value="' + t[0] + '"'
        + (t[0] === tipoEfectivo ? ' checked' : '') + '>' + t[1] + '</label>';
    }).join('') + '</div>'
    + '<fieldset><legend>Cuándo</legend><div class="rejilla">' + campo('e_fecha', 'Fecha en que se cobró o pagó', entrada('e_fecha', val('e_fecha') || D.hoy, 'type="date"')) + '</div></fieldset>';
  if (tipoEfectivo === 'cuotas' && !D.config.bdSocios) {
    h += '<fieldset><legend>Cuotas</legend>'
      + '<div class="ayuda">Este centro no tiene base de socios conectada: apunta quién paga, su tramo y el importe. '
      + 'Se crea una fila por persona, con la partida de cuotas de su tramo. Cuando lleves este dinero al banco, '
      + 'apúntalo como <a href="#" id="irTraspaso">traspaso</a>.</div><div class="rejilla">'
      + campo('m_nombre', 'Quién paga', entrada('m_nombre', '', 'placeholder="Nombre y apellidos"'))
      + campo('m_tramo', 'Tramo', '<select id="m_tramo">' + D.tramos.map(function (t) {
          return '<option value="' + esc(t.partida) + '">' + esc(t.tramo + ' · ' + partidaTexto(t.partida)) + '</option>'; }).join('') + '</select>')
      + campo('m_importe', 'Importe (€)', entrada('m_importe', '', 'inputmode="decimal" placeholder="20,00"'))
      + '</div><div style="margin-top:8px"><button id="m_anadir">Añadir a la lista</button></div>'
      + '<div id="tablaCuotas"></div></fieldset>';
  } else if (tipoEfectivo === 'cuotas') {
    h += '<fieldset><legend>Socios</legend>'
      + '<div class="ayuda">Una fila por socio, con su ID: así la cuota se apunta como pagada en BD Socios (se sincroniza al guardar). '
      + 'Cuando lleves este dinero al banco, apúntalo como <a href="#" id="irTraspaso">traspaso</a>.</div>'
      + '<input id="buscarSocio" placeholder="Busca por nombre, apellidos o número de socio…" autocomplete="off" style="width:100%;padding:7px 9px;border:1px solid #b9c0db;border-radius:6px;font-family:inherit">'
      + '<div id="resultadosSocio" class="socios" hidden></div>'
      + '<div id="tablaCuotas"></div></fieldset>';
  } else {
    var gasto = tipoEfectivo === 'gasto';
    h += '<fieldset><legend>' + (gasto ? 'Gasto' : 'Ingreso') + '</legend><div class="rejilla">'
      + campo('e_importe', 'Importe (€)', entrada('e_importe', '', 'inputmode="decimal" placeholder="12,50"'))
      + campo('f_partida', 'Partida', combo('f_partida', 'Código o nombre'))
      + campo('f_subpartida', 'Subpartida', '<select id="f_subpartida"></select>')
      + campo('f_descripcion', 'Descripción', entrada('f_descripcion', '', gasto ? 'placeholder="Qué se ha comprado"' : 'placeholder="De qué es el ingreso"'), { ancho: true })
      + '</div></fieldset>'
      + (gasto ? '<fieldset><legend>Proveedor</legend><div class="rejilla">' + camposProveedor({}, false) + '</div></fieldset>' + zonaFactura(null) : '')
      + (gasto ? '' : '<div class="ayuda">¿Es la cuota de un socio? Usa «Cuotas cobradas en mano»'
        + (D.config.bdSocios ? ': así se apunta también en BD Socios.' : '.') + '</div>');
  }
  c.innerHTML = h;
  $('guardar').textContent = tipoEfectivo === 'cuotas' ? 'Apuntar las cuotas' : 'Apuntar';
  document.querySelectorAll('#tiposEfectivo input').forEach(function (r) {
    r.addEventListener('change', function () {
      if (cuotas.length && !confirm('Se perderá la lista de socios. ¿Seguir?')) { pintarEfectivo(c); return; }
      cuotas = []; archivo = null; tipoEfectivo = r.value; pintarEfectivo(c);
    });
  });
  if (tipoEfectivo === 'cuotas') {
    $('irTraspaso').addEventListener('click', function (ev) { ev.preventDefault(); irA('traspaso'); });
    if (D.config.bdSocios) {
      $('buscarSocio').addEventListener('focus', cargarSocios);
      $('buscarSocio').addEventListener('input', pintarSocios);
    } else {
      $('m_anadir').addEventListener('click', function () {
        if (!val('m_nombre') || !numero(val('m_importe'))) { estado('Escribe quién paga y el importe.', true); return; }
        cuotas.push({ idSocio: '', nombre: val('m_nombre'), partida: $('m_tramo').value, importe: val('m_importe') });
        $('m_nombre').value = ''; $('m_importe').value = ''; $('m_nombre').focus();
        pintarCuotas();
      });
    }
    pintarCuotas();
  } else {
    montarComboPartida('f_partida', tipoEfectivo === 'gasto' ? 'G' : 'I', '', function (p) { rellenarSubpartidas('f_subpartida', p, ''); });
    rellenarSubpartidas('f_subpartida', '', '');
    montarProveedor();
    montarZonaFactura();
  }
}
function cargarSocios() {
  if (socios) return;
  $('resultadosSocio').hidden = false;
  if (!D.config.bdSocios) {
    $('resultadosSocio').innerHTML = '<div class="socio">Falta la base de socios en la hoja Ajustes: no se puede buscar por nombre. '
      + 'Escribe el ID de socio (JMV-000000) y pulsa «Apuntar las cuotas».</div>';
    return;
  }
  $('resultadosSocio').innerHTML = '<div class="socio">Leyendo BD Socios…</div>';
  google.script.run
    .withSuccessHandler(function (xs) { socios = xs; pintarSocios(); })
    .withFailureHandler(function (err) { $('resultadosSocio').innerHTML = '<div class="socio rojo">No se ha podido leer BD Socios: ' + esc(err.message || err) + '</div>'; })
    .sociosParaEfectivo();
}
function pintarSocios() {
  var caja = $('resultadosSocio');
  if (!socios) return;
  var q = norm($('buscarSocio').value).split(/\s+/).filter(Boolean);
  if (!q.length) { caja.hidden = true; return; }
  var xs = socios.filter(function (s) {
    var t = norm(s.nombre + ' ' + s.id + ' ' + s.id.replace(/\D/g, '').replace(/^0+/, ''));
    return q.every(function (p) { return t.indexOf(p) >= 0; });
  }).slice(0, 30);
  caja.hidden = false;
  if (!xs.length) { caja.innerHTML = '<div class="socio">Nadie con ese nombre inscrito en el curso ' + esc(D.curso) + '.</div>'; return; }
  caja.innerHTML = xs.map(function (s, i) {
    var enCaja = D.sociosEnCaja[s.id];
    var estadoCuota = s.pagada === 'Sí' ? '<span class="verde">pagada</span>' : s.pagada === 'Exenta' ? '<span class="verde">exenta</span>'
      : s.pagada === 'Parcial' ? '<span class="naranja">pago parcial</span>' : '<span>sin pagar</span>';
    return '<div class="socio" data-i="' + i + '"><div><b>' + esc(s.nombre) + '</b><div class="sub">' + esc(s.id) + ' · tramo ' + esc(s.tramo || '¿?')
      + (enCaja ? ' · <span class="naranja">ya en Caja: ' + esc(enCaja.join(', ')) + '</span>' : '') + '</div></div>'
      + '<div class="der">' + (s.cuota ? euros(s.cuota) : '¿cuota?') + ' · ' + estadoCuota + '</div></div>';
  }).join('');
  caja.querySelectorAll('.socio[data-i]').forEach(function (el) {
    el.addEventListener('click', function () { añadirCuota(xs[Number(el.dataset.i)]); });
  });
}
function añadirCuota(s) {
  if (cuotas.some(function (c) { return c.idSocio === s.id; })) { estado(s.nombre + ' ya está en la lista.', true); return; }
  cuotas.push({ idSocio: s.id, nombre: s.nombre, importe: s.cuota ? importeTexto(s.cuota) : '', partida: s.partida,
    aviso: s.pagada === 'Sí' ? 'Su cuota ya figura como pagada en BD Socios.' : (D.sociosEnCaja[s.id] ? 'Ya tiene un asiento en Caja: ' + D.sociosEnCaja[s.id].join(', ') : '') });
  $('buscarSocio').value = ''; $('resultadosSocio').hidden = true; $('buscarSocio').focus();
  pintarCuotas();
}
function pintarCuotas() {
  var t = $('tablaCuotas');
  if (!cuotas.length) { t.innerHTML = '<div class="ayuda" style="margin-top:10px">Todavía no has añadido a nadie.</div>'; estado(''); return; }
  var total = cuotas.reduce(function (s, c) { return s + numero(c.importe); }, 0);
  t.innerHTML = '<table class="tabla"><tr><th>' + (D.config.bdSocios ? 'Socio' : 'Quién paga') + '</th><th>Partida</th><th>Importe (€)</th><th></th></tr>'
    + cuotas.map(function (c, i) {
      return '<tr><td><b>' + esc(c.nombre) + '</b> <span class="sub" style="color:#667">' + esc(c.idSocio) + '</span>'
        + (c.aviso ? '<div class="naranja" style="font-size:11.5px">⚠ ' + esc(c.aviso) + '</div>' : '') + '</td>'
        + '<td>' + esc(c.partida || '(al sincronizar)') + '</td>'
        + '<td><input data-i="' + i + '" value="' + esc(c.importe) + '" inputmode="decimal"></td>'
        + '<td><button class="mini" data-quitar="' + i + '">Quitar</button></td></tr>';
    }).join('')
    + '<tr><td colspan="2" style="text-align:right"><b>Total</b></td><td><b>' + euros(total) + '</b></td><td></td></tr></table>';
  t.querySelectorAll('input[data-i]').forEach(function (e) {
    e.addEventListener('change', function () { cuotas[Number(e.dataset.i)].importe = e.value; pintarCuotas(); });
  });
  t.querySelectorAll('[data-quitar]').forEach(function (b) {
    b.addEventListener('click', function () { cuotas.splice(Number(b.dataset.quitar), 1); pintarCuotas(); });
  });
  estado(cuotas.length + (cuotas.length === 1 ? ' cuota' : ' cuotas') + ' sin guardar.', true);
}
function guardarEfectivoAhora() {
  var datos = { tipo: tipoEfectivo, fecha: val('e_fecha') };
  if (tipoEfectivo === 'cuotas') {
    var escrito = D.config.bdSocios ? val('buscarSocio') : '';
    if (!cuotas.length && /^jmv-?\d+$/i.test(escrito)) {
      var n = escrito.replace(/\D/g, '');
      cuotas.push({ idSocio: 'JMV-' + ('000000' + n).slice(-6), nombre: '', importe: '', partida: '' });
      pintarCuotas();
      resultado('info', 'Pon el importe de la cuota y vuelve a pulsar «Apuntar las cuotas».'); return;
    }
    datos.cuotas = cuotas.map(function (c) { return { idSocio: c.idSocio, nombre: c.nombre, importe: c.importe, partida: c.partida }; });
  } else {
    if (val('f_partida') && !partidaDe('f_partida')) { resultado('error', 'Elige la partida de la lista', ['«' + val('f_partida') + '» no es ninguna partida.']); return; }
    datos.importe = val('e_importe'); datos.partida = partidaDe('f_partida'); datos.subpartida = val('f_subpartida');
    datos.descripcion = val('f_descripcion'); datos.proveedor = val('f_proveedor'); datos.cif = val('f_cif');
    if (tipoEfectivo === 'gasto') datos.sinFactura = valSinFactura() || '';
  }
  enviar(tipoEfectivo === 'cuotas' && D.config.bdSocios ? 'Apuntando y sincronizando con BD Socios…' : 'Apuntando…', 'guardarEfectivo', datos, function (r) {
    cuotas = []; archivo = null; socios = null;
    pintarEfectivo($('contenido'));
    resultado(r.lineas.some(function (l) { return l.charAt(0) === '⚠'; }) ? 'aviso' : 'ok', 'Apuntado en efectivo', r.lineas);
    cargar(true, function () { pintarLateral(); var x = $('resultado') ? $('resultado').outerHTML : ''; pintarEfectivo($('contenido')); if (x) $('contenido').insertAdjacentHTML('afterbegin', x); });
  }, tipoEfectivo === 'gasto');
}

/* ---------------------------------------------------------------
   ENVIAR AL SERVIDOR
   --------------------------------------------------------------- */

function enviar(texto, funcion, datos, alAcabar, conArchivo) {
  if (ocupado) return;
  ocupado = true;
  $('guardar').disabled = true;
  cargando(true, texto);
  (conArchivo ? leerArchivo(archivo) : Promise.resolve(null)).then(function (fichero) {
    if (fichero && typeof datos === 'object') datos.archivo = fichero;
    google.script.run
      .withSuccessHandler(function (r) { ocupado = false; cargando(false); $('guardar').disabled = false; estado(''); alAcabar(r); })
      .withFailureHandler(fallo)[funcion](datos);
  }, fallo);
}

$('guardar').addEventListener('click', function () {
  if (S === 'traspaso') guardarTraspaso();
  else if (S === 'transferencia') guardarNuevaTransferencia();
  else if (S === 'efectivo') guardarEfectivoAhora();
  else guardarAsiento();
});
$('cerrar').addEventListener('click', function () {
  if (hayCambios() && !confirm('Hay cambios sin guardar. ¿Cerrar igualmente?')) return;
  google.script.host.close();
});
$('recargar').addEventListener('click', function () {
  if (hayCambios() && !confirm('Se perderán los cambios sin guardar. ¿Recargar?')) return;
  archivo = null; cargar(false, pintarPrincipal);
});
$('buscar').addEventListener('input', pintarLista);
document.querySelectorAll('#secciones button').forEach(function (b) {
  b.addEventListener('click', function () { if (b.dataset.s !== S || hecho) irA(b.dataset.s); });
});

cargar(false, function () {
  if (INICIAL && LISTAS[S] && D.asientos.some(function (a) { return a.id === INICIAL && enLista(S, a); })) sel = INICIAL;
  else if (LISTAS[S]) { var xs = listaDe(S); sel = xs.length ? xs[0].id : ''; }
  pintarLateral();
  pintarPrincipal();
});
</script>
